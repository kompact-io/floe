<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floe Node Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.24/dist/uPlot.min.css" />
  <script src="https://unpkg.com/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h2>FLOE NODE STATUS</h2>
      <span class="status-dot down" id="status-dot"></span>
    </div>
    <div class="nav-links">
      <div class="badge badge-red" id="status-badge" style="display: none;">METRICS UNREACHABLE</div>
      <a href="/demo/">QUERY DEMO &rarr;</a>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">BLOCKS APPLIED (PER MIN)</div>
      <div id="chart-applied" class="chart-box"></div>
    </div>

    <div class="card">
      <div class="card-title">UTXOS CREATED / SPENT</div>
      <div id="chart-utxos" class="chart-box"></div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
      <div class="card-title">API REQUEST THROUGHPUT BY SCHEME (REQ/S)</div>
      <div id="chart-requests" class="chart-box"></div>
    </div>
  </div>

  <script>
    // Proxied same-origin to VictoriaMetrics (`/api/v1/query_range`) --
    // this page never talks to VictoriaMetrics' own host directly, see
    // the Caddy guidance alongside this repo's deployment docs.
    const API_ENDPOINT = '/api/v1/query_range';
    const REFRESH_MS = 10000;
    const plots = new Map();

    const COLOR_PALETTE = ['#22c55e', '#22d3ee', '#c084fc', '#f97316', '#eab308', '#ef4444'];

    // Each chart runs one or more independent PromQL range queries and
    // merges their results into one set of series. A plain entry
    // ({query, label, color}) always contributes exactly one series
    // under that fixed label/color, even when the query currently has
    // no samples (an empty line, not a vanished legend row) -- so a
    // chart's legend membership comes from this config, not from
    // whichever metrics happen to have data right now. `byLabel`
    // entries are the exception: they fan out into one series per
    // distinct value of that metric label (e.g. one per `scheme`),
    // however many VictoriaMetrics currently reports.
    const CHARTS = [
      {
        id: 'chart-applied',
        queries: [
          { query: 'increase(floe_applied_total[1m])', label: 'Applied/min', color: '#22d3ee' }, // Cyan
          { query: 'increase(floe_rolled_back_total[1m])', label: 'Rollbacks/min', color: '#ef4444' } // Red
        ]
      },
      {
        id: 'chart-utxos',
        queries: [
          { query: 'increase(floe_utxos_created_total[1m])', label: 'Created/min', color: '#22c55e' }, // Green
          { query: 'increase(floe_utxos_spent_total[1m])', label: 'Spent/min', color: '#f97316' } // Orange
        ]
      },
      {
        id: 'chart-requests',
        queries: [
          { query: 'sum(rate(floe_requests_total[1m])) by (scheme)', byLabel: 'scheme' }
        ]
      }
    ];

    // Compact axis labels, but with enough decimals that adjacent ticks
    // stay distinguishable -- a narrow value range (e.g. 4.495M-4.505M)
    // rounded to a fixed 2 decimals used to collapse every tick to the
    // same "4.50M" label. Decimals are picked per-chart (0-4) as the
    // fewest that still make every tick in the set unique.
    function unitFor(maxAbs) {
      if (maxAbs >= 1e9) return { divisor: 1e9, suffix: 'B' };
      if (maxAbs >= 1e6) return { divisor: 1e6, suffix: 'M' };
      if (maxAbs >= 1e3) return { divisor: 1e3, suffix: 'K' };
      return { divisor: 1, suffix: '' };
    }

    function formatAxisTicks(ticks) {
      const nums = ticks.filter(v => v !== null && v !== undefined && !Number.isNaN(v));
      const maxAbs = Math.max(0, ...nums.map(Math.abs));
      const { divisor, suffix } = unitFor(maxAbs);

      let decimals = suffix ? 2 : 0;
      if (suffix) {
        const scaled = nums.map(v => v / divisor);
        for (let d = 0; d <= 4; d++) {
          const labels = scaled.map(v => v.toFixed(d));
          if (new Set(labels).size === labels.length) {
            decimals = d;
            break;
          }
          decimals = d;
        }
      }

      return ticks.map(v => {
        if (v === null || v === undefined || Number.isNaN(v)) return '';
        if (!suffix) return Number.isInteger(v) ? String(v) : v.toFixed(2);
        return (v / divisor).toFixed(decimals) + suffix;
      });
    }

    // Full-precision value, for the legend/hover readout -- distinct from
    // the axis's rounded, unit-suffixed labels.
    function formatExactNumber(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return '--';
      return v.toLocaleString(undefined, { maximumFractionDigits: 3 });
    }

    function createPlotOptions(containerEl, seriesDefs) {
      return {
        width: containerEl.clientWidth,
        height: containerEl.clientHeight,
        series: [
          { label: "TIME", value: (self, v) => v ? new Date(v * 1000).toLocaleTimeString() : "--" },
          ...seriesDefs.map(s => ({
            label: s.label,
            stroke: s.color,
            fill: 'transparent',
            width: 2,
            value: (self, v) => formatExactNumber(v)
          }))
        ],
        axes: [
          {
            stroke: "#ffffff",
            grid: { stroke: "#27272a", width: 1 },
            font: "10px 'JetBrains Mono', monospace"
          },
          {
            stroke: "#ffffff",
            grid: { stroke: "#27272a", width: 1 },
            font: "10px 'JetBrains Mono', monospace",
            size: 64,
            values: (self, ticks) => formatAxisTicks(ticks)
          }
        ],
        cursor: { points: { size: 6 } },
        legend: { show: true }
      };
    }

    async function fetchRange(query) {
      const now = Math.floor(Date.now() / 1000);
      const start = now - 3600;
      const url = `${API_ENDPOINT}?query=${encodeURIComponent(query)}&start=${start}&end=${now}&step=15s`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const json = await res.json();
      return (json.data && json.data.result) || [];
    }

    // Runs one chart's sub-queries and merges them into one shared
    // timestamp axis + series list, per `CHARTS`'s own doc comment.
    async function fetchChart(queries) {
      let timestamps = [];
      const series = [];
      let ok = true;
      for (const q of queries) {
        let rows = [];
        try {
          rows = await fetchRange(q.query);
        } catch (e) {
          console.error('Fetch failed', e);
          ok = false;
        }
        if (rows.length && !timestamps.length) {
          timestamps = rows[0].values.map(v => v[0]);
        }
        if (q.byLabel) {
          rows.forEach((r, i) => {
            series.push({
              label: (r.metric[q.byLabel] || 'value').toUpperCase(),
              color: COLOR_PALETTE[i % COLOR_PALETTE.length],
              // Raw [ts, value] pairs -- aligned onto the shared
              // `timestamps` axis by timestamp below, not by position,
              // since a series with less history (e.g. a newly added
              // metric) legitimately returns fewer points than another
              // series in the same chart.
              raw: r.values
            });
          });
        } else {
          const r = rows[0];
          series.push({
            label: q.label,
            color: q.color,
            raw: r ? r.values : []
          });
        }
      }
      return { timestamps, series, ok };
    }

    function setConnected(ok) {
      document.getElementById('status-dot').classList.toggle('down', !ok);
      document.getElementById('status-badge').style.display = ok ? 'none' : '';
    }

    async function refreshDashboard() {
      let ok = true;
      for (const config of CHARTS) {
        const container = document.getElementById(config.id);
        const { timestamps, series, ok: chartOk } = await fetchChart(config.queries);
        ok = ok && chartOk;

        const seriesDefs = series.map(s => ({ label: s.label, color: s.color }));
        // Aligns each sub-query's raw [ts, value] pairs onto the
        // chart's shared timestamp axis by timestamp, not by array
        // position/length -- a series with less history (e.g. a newly
        // added metric still backfilling) legitimately returns fewer
        // points than another series in the same chart, and must not
        // have its real values discarded for that.
        const data = [
          timestamps,
          ...series.map(s => {
            const byTs = new Map(s.raw.map(([ts, v]) => [ts, parseFloat(v)]));
            return timestamps.map(ts => (byTs.has(ts) ? byTs.get(ts) : null));
          })
        ];

        const existing = plots.get(config.id);
        if (!existing || existing.seriesCount !== seriesDefs.length) {
          existing?.resizeObserver.disconnect();
          existing?.instance.destroy();

          const opts = createPlotOptions(container, seriesDefs);
          const instance = new uPlot(opts, data, container);

          const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
              instance.setSize({
                width: entry.contentRect.width,
                height: entry.contentRect.height
              });
            }
          });
          resizeObserver.observe(container);

          plots.set(config.id, { instance, resizeObserver, seriesCount: seriesDefs.length });
        } else {
          existing.instance.setData(data);
        }
      }
      setConnected(ok);
    }

    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
