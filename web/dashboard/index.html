<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floe Node Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/uplot@1.6.24/dist/uPlot.min.css" />
  <script src="https://unpkg.com/uplot@1.6.24/dist/uPlot.iife.min.js"></script>
  <link rel="stylesheet" href="/shared.css" />
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h2>FLOE NODE STATUS</h2>
      <span class="status-dot down" id="status-dot"></span>
    </div>
    <div class="nav-links">
      <div class="badge badge-red" id="status-badge" style="display: none;">METRICS UNREACHABLE</div>
      <a href="/demo/">QUERY DEMO &rarr;</a>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">BLOCKS APPLIED (PER MIN)</div>
      <div id="chart-applied" class="chart-box"></div>
    </div>

    <div class="card">
      <div class="card-title">UTXO INDEX COUNT</div>
      <div id="chart-utxos" class="chart-box"></div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
      <div class="card-title">API REQUEST THROUGHPUT BY SCHEME (REQ/S)</div>
      <div id="chart-requests" class="chart-box"></div>
    </div>
  </div>

  <script>
    // Proxied same-origin to VictoriaMetrics (`/api/v1/query_range`) --
    // this page never talks to VictoriaMetrics' own host directly, see
    // the Caddy guidance alongside this repo's deployment docs.
    const API_ENDPOINT = '/api/v1/query_range';
    const REFRESH_MS = 10000;
    const plots = new Map();

    const COLOR_PALETTE = ['#22c55e', '#22d3ee', '#c084fc', '#f97316', '#eab308', '#ef4444'];

    const CHARTS = [
      {
        id: 'chart-applied',
        query: 'increase(floe_applied_total[1m])',
        label: 'Applied/min',
        color: '#22d3ee' // Cyan
      },
      {
        id: 'chart-utxos',
        query: 'floe_utxo_count',
        label: 'UTxOs',
        color: '#c084fc' // Purple
      },
      {
        id: 'chart-requests',
        query: 'sum(rate(floe_requests_total[1m])) by (scheme)',
        label: 'Requests',
        color: '#22c55e' // Green
      }
    ];

    function formatCompactNumber(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return '';
      const abs = Math.abs(v);
      if (abs >= 1e9) return (v / 1e9).toFixed(2) + 'B';
      if (abs >= 1e6) return (v / 1e6).toFixed(2) + 'M';
      if (abs >= 1e3) return (v / 1e3).toFixed(2) + 'K';
      return Number.isInteger(v) ? String(v) : v.toFixed(2);
    }

    function createPlotOptions(containerEl, seriesDefs) {
      return {
        width: containerEl.clientWidth,
        height: containerEl.clientHeight,
        series: [
          { label: "TIME", value: (self, v) => v ? new Date(v * 1000).toLocaleTimeString() : "--" },
          ...seriesDefs.map(s => ({ label: s.label, stroke: s.color, fill: 'transparent', width: 2 }))
        ],
        axes: [
          {
            stroke: "#ffffff",
            grid: { stroke: "#27272a", width: 1 },
            font: "10px 'JetBrains Mono', monospace"
          },
          {
            stroke: "#ffffff",
            grid: { stroke: "#27272a", width: 1 },
            font: "10px 'JetBrains Mono', monospace",
            size: 64,
            values: (self, ticks) => ticks.map(formatCompactNumber)
          }
        ],
        legend: { show: seriesDefs.length > 1 }
      };
    }

    async function fetchQueryData(query) {
      const now = Math.floor(Date.now() / 1000);
      const start = now - 3600;
      const url = `${API_ENDPOINT}?query=${encodeURIComponent(query)}&start=${start}&end=${now}&step=15s`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const json = await res.json();

      if (!json.data || !json.data.result.length) return { timestamps: [], series: [] };

      const timestamps = json.data.result[0].values.map(v => v[0]);
      const series = json.data.result.map(r => ({
        label: (r.metric.scheme || r.metric.__name__ || Object.values(r.metric)[0] || 'value').toUpperCase(),
        values: r.values.map(v => parseFloat(v[1]))
      }));

      return { timestamps, series };
    }

    function setConnected(ok) {
      document.getElementById('status-dot').classList.toggle('down', !ok);
      document.getElementById('status-badge').style.display = ok ? 'none' : '';
    }

    async function refreshDashboard() {
      let ok = true;
      for (const config of CHARTS) {
        const container = document.getElementById(config.id);
        let timestamps = [], series = [];
        try {
          ({ timestamps, series } = await fetchQueryData(config.query));
        } catch (e) {
          console.error('Fetch failed', e);
          ok = false;
        }

        const seriesDefs = series.length
          ? series.map((s, i) => ({ label: s.label, color: COLOR_PALETTE[i % COLOR_PALETTE.length] }))
          : [{ label: config.label.toUpperCase(), color: config.color }];
        const data = [timestamps, ...(series.length ? series.map(s => s.values) : [[]])];

        const existing = plots.get(config.id);
        if (!existing || existing.seriesCount !== seriesDefs.length) {
          existing?.resizeObserver.disconnect();
          existing?.instance.destroy();

          const opts = createPlotOptions(container, seriesDefs);
          const instance = new uPlot(opts, data, container);

          const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
              instance.setSize({
                width: entry.contentRect.width,
                height: entry.contentRect.height
              });
            }
          });
          resizeObserver.observe(container);

          plots.set(config.id, { instance, resizeObserver, seriesCount: seriesDefs.length });
        } else {
          existing.instance.setData(data);
        }
      }
      setConnected(ok);
    }

    refreshDashboard();
    setInterval(refreshDashboard, REFRESH_MS);
  </script>
</body>
</html>
