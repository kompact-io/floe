[workspace]
resolver = "2"
members = [
  "crates/client",
  "crates/dto-grpc",
  "crates/dto-http",
  "crates/n2n",
  "crates/integration",
  "crates/server",
]

# crane (flake.nix) can't infer a name/version from this manifest the way
# it does for a single package -- there's no `[package]` table here, only
# `[workspace]`. This is crane's own documented metadata hook for exactly
# that (the alternative is passing `pname`/`cargoToml` by hand at every
# call site, which flake.nix already does for the actual build/deps
# derivations; this covers the ones that don't go through `commonArgs`,
# like `devShell`).
[workspace.metadata.crane]
name = "floe-workspace"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Minimal Cardano UTxO index (mini-index) and its clients"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
futures-util = "0.3"
http = "1"
minicbor = { version = "2.3.0", features = ["derive", "alloc", "half"] }
pallas-network = "1.4"
amaru-kernel = { git = "https://github.com/kompact-io/amaru", branch = "nix-proper" }
amaru-network = { git = "https://github.com/kompact-io/amaru", branch = "nix-proper" }
amaru-ouroboros = { git = "https://github.com/kompact-io/amaru", branch = "nix-proper" }
amaru-ouroboros-traits = { git = "https://github.com/kompact-io/amaru", branch = "nix-proper" }
amaru-protocols = { git = "https://github.com/kompact-io/amaru", branch = "nix-proper" }
amaru-pure-stage = { git = "https://github.com/kompact-io/amaru", branch = "nix-proper" }
proptest = "1"
rayon = "1"
# rustls backend, not native-tls -- no OpenSSL/system-TLS dependency,
# same cert-verification story everywhere this builds. `floe-client`'s
# only non-wasm32 consumer (`http_json`/`http_cbor`'s transport).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "load_extension"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = "0.7.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tonic = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# wasm32-only (floe-client's `wasm` feature). `wasm-bindgen` pinned to
# match nixpkgs' `wasm-bindgen-cli` exactly (currently 0.2.127) -- bump
# both together, or glue generation fails outright.
js-sys = "0.3"
wasm-bindgen = "=0.2.129" # must match nix
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
zstd = "0.14"

# WORKSPACE #
floe-client = { path = "crates/client" }
floe-dto-grpc = { path = "crates/dto-grpc" }
floe-dto-http = { path = "crates/dto-http" }
floe-n2n = { path = "crates/n2n" }
floe-server = { path = "crates/server" }

[profile.release]
lto = true

