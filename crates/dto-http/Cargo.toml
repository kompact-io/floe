[package]
name = "floe-dto-http"
version.workspace = true
edition.workspace = true
description.workspace = true

# `json`/`cbor` are independent: a consumer that only wants one wire
# format doesn't pull the other's deps (serde vs. minicbor). `hex` and
# `amaru-kernel` stay unconditional -- hex
# formatting backs JSON's byte encoding and error messages regardless,
# and address bech32 rendering is needed by both wire formats (see
# `query::Address`).
[features]
json = ["dep:serde"]
cbor = ["dep:minicbor"]
# JSON Schema derivation for the `json`-wire DTOs -- pulls in `json`
# since a schema for a shape that isn't actually serialized to JSON
# this way wouldn't mean anything. Backs the `schema` example (see its
# module doc) that CI publishes to the docs site.
schema = ["json", "dep:schemars"]
# Independent of `json`/`cbor`: `Display` (Prometheus text) needs
# neither, so a consumer wanting only health/metrics doesn't pull in
# query-DTO wire format machinery, or vice versa.
metrics = []

[dependencies]
hex = { workspace = true }
minicbor = { workspace = true, optional = true }
amaru-kernel = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

# Only for the `schema` example's own JSON rendering of `schemars::Schema`
# -- the library itself has no serde_json dependency.
[dev-dependencies]
serde_json = { workspace = true }

[[example]]
name = "schema"
path = "examples/schema.rs"
required-features = ["schema", "metrics"]
