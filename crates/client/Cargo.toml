[package]
name = "floe-client"
version.workspace = true
edition.workspace = true
description.workspace = true

# Keeps the library import path (`use floe_client::...`) and the bin
# name (`floe-client`, matching every existing invocation) distinct --
# same `[lib]` + `[[bin]]` split as `floe-server`.
[lib]
name = "floe_client"
path = "src/lib.rs"
# `cdylib` for `wasm-bindgen`'s wasm32 build; harmless extra on native.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "floe-client"
path = "src/main.rs"
required-features = ["clap", "tracing", "serde_json"]

# Deployment smoke test against a running `floe-server`, see
# `src/bin/smoke/main.rs`.
[[bin]]
name = "floe-smoke"
path = "src/bin/smoke/main.rs"
required-features = ["clap", "tracing", "serde_json"]

# Basic ongoing read traffic against a running `floe-server`, for
# dashboard eyeballing -- not a load-testing tool, see
# `src/bin/traffic/main.rs`.
[[bin]]
name = "floe-traffic"
path = "src/bin/traffic/main.rs"
required-features = ["clap", "tracing", "serde_json"]

[features]
# `clap`/`tracing` are bin-only (parsed args, logging) -- `lib.rs` never
# touches either, so a lib consumer doing `default-features = false,
# features = ["grpc"]` (etc.) pulls neither in. Both get an implicit
# feature of their own name from being optional deps, same as `serde_json`.
default = ["grpc", "http-json", "http-cbor", "clap", "tracing", "serde_json"]
grpc = ["dep:floe-dto-grpc", "dep:tonic"]
# `serde_json` is a genuine lib dependency under this feature --
# `http_json.rs` itself encodes/decodes with it, not just the bins'
# output printing. `dep:reqwest` is wasm32-absent (target-gated, see
# `[target.'cfg(not(target_arch = "wasm32"))'.dependencies]` below) --
# harmless to name here on wasm32 too, since it just can't turn on a
# dependency that was never declared for that target.
http-json = ["serde_json", "dep:reqwest"]
http-cbor = ["dep:reqwest"]
# Bundles both logging deps under one name (each optional dep's own
# implicit feature only covers itself) -- bin-only, see `lib.rs`.
tracing = ["dep:tracing", "dep:tracing-subscriber"]
# wasm32-only: `wasm.rs`/`wasm/*.rs`'s fetch-backed `Backend` +
# `#[wasm_bindgen]` wrapper. Pulls `serde_json` directly, not `http-json`
# -- `http_json`/`http_common` are `reqwest`-backed (via `tokio`'s
# `net` -> `mio`), neither of which builds for wasm32. The four `dep:`
# deps are themselves wasm32-gated below, so enabling this on a native
# build is a no-op.
wasm = ["serde_json", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, optional = true }
floe-dto-grpc = { workspace = true, optional = true }
# `json`/`cbor`/`metrics` unconditionally, mirroring `floe-server`'s own
# dependency line -- codec features, not a bin-vs-lib concern (cheap,
# per `floe-dto-http`'s own doc comment).
floe-dto-http = { workspace = true, features = ["json", "cbor", "metrics"] }
hex = { workspace = true }
minicbor = { workspace = true }
amaru-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# `tls-ring`/`tls-webpki-roots`: `grpc::Client::connect`'s `Endpoint`
# auto-enables TLS with the default webpki roots the moment the given
# URL's scheme is `https` (tonic's own `Endpoint::from_shared`, no code
# on our side needed) -- without these, an `https://` gRPC address
# fails outright. Same rustls/webpki-roots stack `reqwest` already
# pulls in for `http_json`/`http_cbor` (see this crate's `reqwest` dep),
# just tonic's own feature flags for it.
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"], optional = true }
# Bin-only (CLI arg parsing/logging); `lib.rs` never touches either --
# see `[features]`'s own doc comment.
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# wasm32-only: cfg'd out of existence on native, not just unused.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Headers",
  "Request",
  "RequestInit",
  "Response",
  "Window",
] }

# Non-wasm only: `tokio`'s `net` -> `mio` doesn't build for wasm32, so
# this can't be feature-gated away, only target-gated. `signal` is
# extra on top of the workspace default, only for `floe-traffic`'s own
# Ctrl-C handling. `reqwest` backs `http_json.rs`/`http_cbor.rs`'s
# transport (`wasm::transport`'s browser `fetch` covers wasm32
# instead, see its own module doc).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["signal"] }
