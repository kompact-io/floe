/// A consistent view of the state of the ledger
///
/// floe's own fork of UTxORPC's `query.proto`. Diverges on purpose
/// where floe's needs differ (commented inline on the diverging
/// field, e.g. `AnyUtxoData.spent_by` below); stays textually
/// identical to upstream everywhere else.

syntax = "proto3";

package floe.v1.query;

import "google/protobuf/field_mask.proto";
import "floe/v1/cardano.proto";

// Represents a specific point in the blockchain. The zero value (slot
// 0, empty hash, height 0) is the sentinel for "point unknown" -- see
// `AnyUtxoData`/`AnyChainTx`'s `block_ref`.
message ChainPoint {
  uint64 slot = 1; // Slot number.
  bytes hash = 2; // Block hash.
  uint64 height = 3; // Block height.
  uint64 timestamp = 4; // Block ms timestamp
}

// floe: unused -- no RPC in this service returns a block (no `DumpUtxos`/
// block-streaming endpoint; see `QueryService`'s own comment).
message AnyChainBlock {
  bytes native_bytes = 1; // Original bytes as defined by the chain
  oneof chain {
    floe.v1.cardano.Block cardano = 2; // A parsed Cardano block.
  }
}

// Represents a reference to a transaction output
message TxoRef {
  bytes hash = 1; // Tx hash.
  uint32 index = 2; // Output index.
}

// Request to get the chain parameters. floe: `ReadParams` always returns UNIMPLEMENTED (see TODO.md's "Protocol params").
message ReadParamsRequest {
  google.protobuf.FieldMask field_mask = 1; // Field mask to selectively return fields in the parsed response.
}

// Request to get the chain config. floe: `ReadGenesis` always returns UNIMPLEMENTED.
message ReadGenesisRequest {
  google.protobuf.FieldMask field_mask = 1; // Field mask to selectively return fields in the parsed response.
}

// Request to get the era summary. floe: `ReadEraSummary` always returns UNIMPLEMENTED.
message ReadEraSummaryRequest {
  google.protobuf.FieldMask field_mask = 1; // Field mask to selectively return fields in the parsed response.
}

// Response containing the genesis configs. floe: unused -- `ReadGenesis` is unimplemented.
message ReadGenesisResponse {
  bytes genesis = 1; // genesis hash for the chain
  string caip2 = 2; // the caip-2 ID for this network
  oneof config {
    floe.v1.cardano.Genesis cardano = 3; // Cardano genesis
  }
}

// Response containing the era summaries. floe: unused -- `ReadEraSummary` is unimplemented.
message ReadEraSummaryResponse {
  oneof summary {
    floe.v1.cardano.EraSummaries cardano = 1; // Cardano era summaries
  }
}

// An envelope that holds parameter data from any of the compatible chains. floe: unused -- `ReadParams` is unimplemented.
message AnyChainParams {
  oneof params {
    floe.v1.cardano.PParams cardano = 1; // Cardano parameters
  }
}

// Response containing the chain parameters. floe: unused -- `ReadParams` is unimplemented.
message ReadParamsResponse {
  AnyChainParams values = 1; // The value of the parameters.
  ChainPoint ledger_tip = 2; // The chain point that represent the ledger current position.
}

// An envelope that wraps a chain-specific ledger-state query. floe: unused -- `ReadState` is unimplemented.
message AnyChainStateQuery {
  oneof query {
    floe.v1.cardano.StateQuery cardano = 1; // A Cardano ledger-state query.
  }
}

// An envelope that wraps a chain-specific ledger-state query result. floe: unused -- `ReadState` is unimplemented.
message AnyChainStateData {
  oneof result {
    floe.v1.cardano.StateData cardano = 1; // A Cardano ledger-state query result.
  }
}

// Request to run a chain-specific ledger-state query against the current ledger snapshot. floe: `ReadState` always returns UNIMPLEMENTED.
message ReadStateRequest {
  AnyChainStateQuery query = 1; // The chain-specific query to evaluate.
  google.protobuf.FieldMask field_mask = 2; // Field mask to selectively return fields.
}

// Response carrying the ledger-state query result. floe: unused -- `ReadState` is unimplemented.
message ReadStateResponse {
  AnyChainStateData result = 1; // The query result.
  ChainPoint ledger_tip = 2; // Chain point representing the snapshot the query was evaluated against.
}

// An envelope that holds a UTxO pattern from any of compatible chains
message AnyUtxoPattern {
  oneof utxo_pattern {
    floe.v1.cardano.TxOutputPattern cardano = 1;
  }
}

// Represents a simple utxo predicate that can composed to create more complex ones.
// floe: `SearchUtxos` only supports a single `match` (a plain address pattern, see
// `cardano.TxOutputPattern`) -- `not`/`all_of`/`any_of` composition returns UNIMPLEMENTED.
message UtxoPredicate {
  optional AnyUtxoPattern match = 1; // Predicate is true if tx exhibits pattern.
  repeated UtxoPredicate not = 2; // Predicate is true if tx doesn't exhibit pattern. floe: unsupported, see message doc.
  repeated UtxoPredicate all_of = 3; // Predicate is true if utxo exhibits all of the patterns. floe: unsupported, see message doc.
  repeated UtxoPredicate any_of = 4; // Predicate is true if utxo exhibits any of the patterns. floe: unsupported, see message doc.
}

// An envelope that holds a UTxO from any of compatible chains
message AnyUtxoData {
  bytes native_bytes = 1; // Original bytes as defined by the chain. floe: never populated -- always empty, the parsed `cardano` arm is authoritative.
  TxoRef txo_ref = 2; // Hash of the previous transaction.
  oneof parsed_state {
    floe.v1.cardano.TxOutput cardano = 3; // A cardano UTxO
  }
  ChainPoint block_ref = 4; // The chain point that represents the block this UTxO was created in. Zero-valued ("unknown") once that block has been pruned, or if it predates floe's own history (e.g. inherited via a seed snapshot).

  // floe divergence: not a bare boolean. `spent_by` is a pivot into
  // `ReadTx` for the spending tx's own `block_ref` (and future
  // redeemer) -- no separate `spent_slot`, that would just be a
  // stale copy of the same data. Absent means confirmed unspent,
  // never "unknown": floe always resolves spent status before
  // returning an item.
  optional bytes spent_by = 5; // Hash of the tx that spent this output, if any.
}

// Request to get specific UTxOs
message ReadUtxosRequest {
  repeated TxoRef keys = 1; // List of keys UTxOs.
  google.protobuf.FieldMask field_mask = 2; // Field mask to selectively return fields.
}

// Response containing the UTxOs associated with the requested addresses.
message ReadUtxosResponse {
  repeated AnyUtxoData items = 1; // List of UTxOs.
  ChainPoint ledger_tip = 2; // The chain point that represent the ledger current position.
}

// Request to search for UTxO based on a pattern.
message SearchUtxosRequest {
  optional UtxoPredicate predicate = 1; // Pattern to match UTxOs by.
  google.protobuf.FieldMask field_mask = 2; // Field mask to selectively return fields.
  optional int32 max_items = 3; // The maximum number of items to return.
  optional string start_token = 4; // The next_page_token value returned from a previous request, if any.

  // floe addition: when given, `items` also includes matching UTxOs
  // spent after `since` (not just the live set) -- `spent_by` (floe's
  // own `AnyUtxoData` divergence) tells them apart. Stale (too old, or
  // rolled back) fails the call with `OUT_OF_RANGE`/`ABORTED` rather
  // than silently returning an incomplete diff -- see `Point`'s own
  // doc comment.
  optional Point since = 5;
}

// Response containing the UTxOs that match the requested addresses.
message SearchUtxosResponse {
  repeated AnyUtxoData items = 1; // List of UTxOs.
  ChainPoint ledger_tip = 2; // The chain point that represent the ledger current position.
  optional string next_token = 3; // Token to retrieve the next page of results, absent if there are no more results.
}

// Request to get a datum
message ReadDataRequest {
  bytes key = 1; // Hash of the datum to fetch.
  google.protobuf.FieldMask field_mask = 2; // Field mask to selectively return fields in the response.
}

// An envelope that holds a datum for any of the compatible chains
message AnyChainDatum {
  bytes native_bytes = 1; // Original bytes as defined by the chain
  bytes key = 2;
  oneof parsed_state {
    floe.v1.cardano.PlutusData cardano = 3; // A cardano UTxO
  }
}

// Response containing the requested datum
message ReadDataResponse {
  AnyChainDatum value = 1; // The value of the datum.
  ChainPoint ledger_tip = 2; // The chain point that represent the ledger current position.
}

// Request to get a transaction by hash
message ReadTxRequest {
  bytes hash = 1; // The hash of the transaction.
  google.protobuf.FieldMask field_mask = 2; // Field mask to selectively return fields in the response.
}

// Represents a transaction from any supported blockchain.
message AnyChainTx {
  bytes native_bytes = 1; // Original bytes as defined by the chain. floe: never populated -- always empty, the parsed `cardano` arm is authoritative.
  oneof chain {
    floe.v1.cardano.Tx cardano = 2; // A Cardano transaction.
  }
  ChainPoint block_ref = 3; // The chain point that represents the block this transaction belongs to. Zero-valued ("unknown") once that block has been pruned, or if it predates floe's own history (e.g. inherited via a seed snapshot).
}

// Response containing the transaction associated with the requested hash.
message ReadTxResponse {
  AnyChainTx tx = 1; // The transaction.
  ChainPoint ledger_tip = 2; // The chain point that represent the ledger current position.
}

// floe addition (not in the utxorpc spec): a reorg-safe resync point
// for `SearchUtxos`'s `since`. Unlike `ChainPoint` (always-populated
// output), both fields here are independently optional, as an input
// filter:
// - `hash` present -> strict: server checks it's still canonical at
//   `slot`; if not -> the call fails (`OUT_OF_RANGE`/`ABORTED`), never
//   silently "nothing changed".
// - `hash` absent, `slot` present -> permissive: bare `slot > N`
//   filter, no chain-validity check. Caller's own responsibility.
// - both absent -> no lower bound (every row matching the address,
//   from genesis).
message Point {
  optional uint64 slot = 1;
  optional bytes hash = 2;
}

// Service definition for querying the state of the chain.
service QueryService {
  rpc ReadParams(ReadParamsRequest) returns (ReadParamsResponse); // Get overall chain state.
  rpc ReadUtxos(ReadUtxosRequest) returns (ReadUtxosResponse); // Read specific UTxOs by reference.
  rpc SearchUtxos(SearchUtxosRequest) returns (SearchUtxosResponse); // Search for UTxO based on a pattern.
  rpc ReadData(ReadDataRequest) returns (ReadDataResponse); // Read a specific datum by hash
  rpc ReadTx(ReadTxRequest) returns (ReadTxResponse); // Get Txs by chain-specific criteria.
  rpc ReadGenesis(ReadGenesisRequest) returns (ReadGenesisResponse); // Get the genesis configuration
  rpc ReadEraSummary(ReadEraSummaryRequest) returns (ReadEraSummaryResponse); // Get the chain era summary
  rpc ReadState(ReadStateRequest) returns (ReadStateResponse); // Run a chain-specific ledger-state query (e.g. stake pool distribution).

  // TODO: decide if we want to expand the scope
  // rpc DumpUtxos(ReadUtxosRequest) returns (stream ReadUtxosResponse); // Dump all available utxos
  // rpc ReadAccount(ReadAccountRequest) returns (ReadAccountReponse); // Get state of a particular account
}
