[package]
name = "floe-server"
version.workspace = true
edition.workspace = true
description.workspace = true

# Keeps the library import path (`use floe::...`, in `main.rs` and the
# examples) and the actual executable name (matching every existing
# runbook/systemd unit/deployment that invokes `floe serve`/`floe
# run`) both as plain `floe`, even though the crate/package itself is
# `floe-server` under the workspace's `floe-<name>` naming convention.
[lib]
name = "floe"
path = "src/lib.rs"

[[bin]]
name = "floe"
path = "src/main.rs"

[features]
default = ["grpc", "http-json", "http-cbor"]
grpc = ["dep:tonic", "dep:floe-dto-grpc"]
http-json = []
http-cbor = []

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true , optional = true } # FIXME : Required?
clap = { workspace = true }
hex = { workspace = true }
floe-dto-grpc = { workspace = true, optional = true }
floe-dto-http = { workspace = true, features = ["json", "cbor", "metrics"] }
http = { workspace = true }
minicbor = { workspace = true }
pallas-network = { workspace = true }
amaru-kernel = { workspace = true }
floe-n2n = { workspace = true }
rayon = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, optional = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zstd = { workspace = true }
tikv-jemallocator = { workspace = true }
tikv-jemalloc-ctl = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
